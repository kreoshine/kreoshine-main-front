name: NodeJS with enb/gulp

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop", "master" ]

jobs:
  build:
    strategy:
      matrix:
        node-version: [14.x]
        npm: [6.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - if: ${{ matrix.npm }}
      name: Pre-install custom version for `npm`
      run:  npm install -g npm@${{ matrix.npm }}

    - name: Install dependencies
      run: |
        npm install

    - name: Perform project make via `enb`
      run: |
        export PATH=./node_modules/.bin:$PATH
        enb make

    - name: Check via `gulp`
      run: |
        export PATH=./node_modules/.bin:$PATH
        gulp
        gulp --verify
